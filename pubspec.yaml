name: elearning_mobile
description: Aplikasi kegiatan belajar dan hafalan untuk sekolah dan pesantren.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.9.0 <4.0.0'
  flutter: '>=3.35.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 2.6.1
  go_router: 14.8.1
  intl: 0.20.3
  shared_preferences: 2.5.3
  qr_flutter: 4.1.0
  mobile_scanner: 7.1.3
  supabase_flutter: 2.10.0
  crypto: 3.0.6
  audioplayers: 6.5.1
  vibration: 3.1.3
  image_picker: ^1.2.3
  webview_flutter: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sound/
    - assets/images/
    - assets/icons/ 

